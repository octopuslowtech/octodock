name: macOS tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/octodock/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'dist/macos/Info.plist'
      - '.github/workflows/macos.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/octodock/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'dist/macos/Info.plist'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests run on the dev profile (workspace crates at opt-level 0, dependencies at 2 as configured in
  # Cargo.toml) instead of --release: a cold build is several times cheaper. No debug info is needed.
  CARGO_PROFILE_DEV_DEBUG: 0

# Every macOS job starts with `rustup update stable`: runner images are not uniform (one image may ship
# rustc 1.98.0 and another 1.98.1) and rust-cache keys include the rustc version, so a job that lands
# on an older image would otherwise miss the cache that `main` seeded.
jobs:
  # Preview tests, native UI regressions and the two native WebKit fixtures. Everything is
  # compiled once (one cargo invocation, so dependencies are built once) and then run.
  macos-native:
    runs-on: macos-latest
    # A cold cache (first run, eviction, toolchain bump) takes about 32 minutes; warm is about 10.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-nextest
        run: |
          # Pinned release, verified against a checksum.
          version=0.9.146
          sha256=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-universal-apple-darwin.tar.gz"
          echo "$sha256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      - name: Build tests and fixtures
        run: |
          cargo nextest run --no-run --locked \
            -p zeron-preview -p zeron-ui \
            --features zeron-ui/browser-fixture --lib --tests
          cargo build --locked -p zeron-preview -p zeron-ui \
            --features zeron-ui/browser-fixture --example browser-fixture --example preview-fixture
      - name: Check macOS application
        env:
          # Match the old `cargo check --release`: no debug assertions.
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: false
        run: cargo check --locked -p octodock
      - name: Preview and native UI regressions
        run: |
          # The attachment filters cover file staging, chips and external Finder drops, whose
          # paths and file metadata are platform-specific.
          cargo nextest run --no-fail-fast --locked \
            -p zeron-preview -p zeron-ui \
            --features zeron-ui/browser-fixture --lib --tests \
            -E 'package(zeron-preview) | (binary_id(zeron-ui) & (test(native_diff_font_geometry) | test(/notify::tests::/) | test(/^attachments::tests::/) | test(/composer::attachment_chip_tests::/) | test(/shell::chat_dropzone_tests::/) | test(=queue::tests::queue_rows_label_attachment_chips_and_file_only_sends) | test(=transcript::tests::user_bubbles_project_attachment_chips_in_place_of_the_strip) | test(=transcript::tests::sent_chips_show_upload_progress_until_their_bytes_land)))'
      - name: Native browser regression and screenshots
        timeout-minutes: 7
        env:
          RUST_BACKTRACE: 1
          FIXTURE_ATTEMPT_TIMEOUT: 110
        run: |
          scripts/ci/run-macos-fixture.sh target/debug/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures*
          if-no-files-found: ignore

  # gpui_macos lives in the pinned GPUI checkout, a separate workspace with its own cache.
  macos-frame-source:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      - name: Check out pinned GPUI for native frame-source tests
        shell: bash
        run: |
          read -r repo rev < <(python3 -c 'import tomllib; gpui = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["gpui"]; print(gpui["git"], gpui["rev"])')
          git init frame-source-tests
          git -C frame-source-tests remote add origin "$repo"
          git -C frame-source-tests fetch --depth=1 origin "$rev"
          git -C frame-source-tests checkout --detach FETCH_HEAD
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: frame-source-tests
      - name: Native frame-source recovery regression
        working-directory: frame-source-tests
        run: cargo test --locked -p gpui_macos --test frame_source_recovery
